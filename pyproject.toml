[build-system]
requires = ["setuptools>=64", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "aind-smartspim-classification"
version = "0.1.0"
description = "Cell candidate classification for the SmartSPIM pipeline using the CellFinder model."
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Camilo Laiton", email = "camilo.laiton@alleninstitute.org" },
    { name = "Nicholas Lusk", email = "nicholas.lusk@alleninstitute.org" },
]
requires-python = ">=3.10"
dependencies = [
    "aind-data-schema==2.8.0",
    "aind-data-schema-models>=5.7.1,<6",
    "pynvml",
    "aind-ng-link==1.0.6",
    "cellfinder>=1.0.0",
    "keras>=3.9.2",
    "matplotlib",
    "natsort",
    "numpy",
    "pandas",
    "psutil",
    "pyyaml",
    "scipy",
    "torch>=2.1.0",
    "argschema",
    "openpyxl",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "coverage",
    "pytest",
    "pytest-cov",
]

[tool.setuptools.packages.find]
where = ["code"]

[tool.pytest.ini_options]
testpaths = ["code/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["aind_smartspim_classification"]

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 100
extend-exclude = ["*.ipynb", ".venv", "*.egg-info", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
# ruff format enforces line-length structurally; E501 only fires on tokens it
# cannot split (URLs, long string literals), so the two rules conflict.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]
